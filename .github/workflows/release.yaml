name: Release

# `tegami ci` opens a version pull request when `.tegami/` has pending
# changelogs. After that pull request merges, it publishes from the publish lock.
on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Version and publish
    if: github.repository == 'pulgueta/lazymage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/setup

      - name: Build package
        run: bun run build

      - name: Version and publish
        run: bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
