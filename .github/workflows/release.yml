name: Run Tegami for versioning and publishing

on:
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository == 'pulgueta/lazymage'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      # Keep the credentials: `tegami ci` pushes the version branch with git.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/setup

      - name: Build
        run: bun run build

      # npm trusted publishing: npm gets a short-lived token through OIDC.
      - name: Release
        run: bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
